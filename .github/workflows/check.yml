name: Australia 462 Peru Alert

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      test_message:
        description: "Send a test message to all Telegram accounts"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: australia-462-checker
  cancel-in-progress: true

jobs:
  check-visa:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Check Peru visa status
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TEST_MESSAGE: ${{ inputs.test_message || 'false' }}
        run: python checker.py

      - name: Save checker state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update checker state"
          git push
