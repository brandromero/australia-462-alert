name: Australia 462 Peru Alert

on:

  # Check Peru every 5 minutes
  schedule:

    - cron: "*/5 * * * *"
      timezone: "Europe/London"

    # Morning message
    - cron: "0 8 * * *"
      timezone: "Europe/London"

    # Night message
    - cron: "0 23 * * *"
      timezone: "Europe/London"

    # 30-minute OPEN updates
    - cron: "*/30 * * * *"
      timezone: "Europe/London"

  # Manual testing
  workflow_dispatch:
    inputs:

      test_message:
        description: "Send a test message to all Telegram accounts"
        required: true
        default: false
        type: boolean


permissions:
  contents: write


jobs:

  check-visa:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------
      # GET CODE
      # ------------------------------------------

      - name: Get code
        uses: actions/checkout@v6


      # ------------------------------------------
      # SETUP PYTHON
      # ------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"


      # ------------------------------------------
      # INSTALL DEPENDENCIES
      # ------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4


      # ------------------------------------------
      # DETERMINE WHAT KIND OF RUN THIS IS
      # ------------------------------------------

      - name: Determine mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          TEST_MESSAGE: ${{ inputs.test_message }}
        run: |

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TEST_MESSAGE" = "true" ]; then

            echo "mode=test" >> "$GITHUB_OUTPUT"

          elif [ "$SCHEDULE" = "0 8 * * *" ]; then

            echo "mode=morning" >> "$GITHUB_OUTPUT"

          elif [ "$SCHEDULE" = "0 23 * * *" ]; then

            echo "mode=night" >> "$GITHUB_OUTPUT"

          elif [ "$SCHEDULE" = "*/30 * * * *" ]; then

            echo "mode=open_update" >> "$GITHUB_OUTPUT"

          else

            echo "mode=check" >> "$GITHUB_OUTPUT"

          fi


      # ------------------------------------------
      # RUN CHECKER
      # ------------------------------------------

      - name: Run checker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          CHECK_MODE: ${{ steps.mode.outputs.mode }}
        run: |

          echo "Running mode: $CHECK_MODE"

          python checker.py


      # ------------------------------------------
      # SAVE STATE
      # ------------------------------------------

      - name: Save checker state
        if: steps.mode.outputs.mode == 'check'
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          git diff --cached --quiet || git commit -m "Update checker state"

          git push
